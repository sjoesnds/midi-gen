name: Quality checks

# Runs the supported melody + chord + bass workflow headless. The broad legacy suite in
# tests/qa_main.cpp remains historical coverage; release gates match the creator workflow:
# Key / Scale / Bars, per-control MAGIC locks, strict rhythm, musical safety, MIDI export and state round-trip.
on:
  push:
  pull_request:
  workflow_dispatch:

# Never build a stale commit when a newer push arrives.
# This prevents rapid development pushes from creating an endless QA queue.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies (JUCE needs them even for a headless target)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libasound2-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build-qa/_deps
          key: ${{ runner.os }}-qa-juce-8.0.14-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S tests -B build-qa -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-qa --config Release --parallel

      - name: Validate source corpus target aggregation
        run: python3 tools/ablation/validate_corpus_targets.py

      - name: Run quality checks
        env:
          MIDIFORGE_PIPELINE_TRACE: "1"
        run: |
          set -o pipefail
          QA=$(find build-qa -type f -name MidiForgeQA -perm -u+x | head -n 1)
          echo "Running $QA with melody pipeline trace"
          "$QA" | tee qa-report.txt

      - name: Run ablation pilot (2 fixed seeds; headless target only)
        if: ${{ !contains(github.event.head_commit.message, '[listen-pack]') }}
        run: |
          set -euo pipefail
          QA=$(find build-qa -type f -name MidiForgeQA -perm -u+x | head -n 1)
          "$QA" --ablation-report 2 ablation-pilot.csv
          test -s ablation-pilot.csv
          rows=$(wc -l < ablation-pilot.csv)
          test "$rows" -eq 61

      - name: Verify corpus layer report determinism (2 fixed seeds; headless only)
        if: ${{ !contains(github.event.head_commit.message, '[listen-pack]') }}
        run: |
          set -euo pipefail
          QA=$(find build-qa -type f -name MidiForgeQA -perm -u+x | head -n 1)
          "$QA" --corpus-layer-ablation 2 corpus-layer-smoke-a.csv >/dev/null
          "$QA" --corpus-layer-ablation 2 corpus-layer-smoke-b.csv >/dev/null
          cmp corpus-layer-smoke-a.csv corpus-layer-smoke-b.csv
          cmp corpus-layer-smoke-a-pipeline.csv corpus-layer-smoke-b-pipeline.csv
          cmp corpus-layer-smoke-a-candidates.csv corpus-layer-smoke-b-candidates.csv
          candidate_rows=$(wc -l < corpus-layer-smoke-a-candidates.csv)
          test "$candidate_rows" -eq 2017
          rows=$(wc -l < corpus-layer-smoke-a.csv)
          test "$rows" -eq 451
          pipeline_rows=$(wc -l < corpus-layer-smoke-a-pipeline.csv)
          test "$pipeline_rows" -eq 3601

      - name: Run corpus layer ablation (64 fixed seeds; headless only)
        if: ${{ !contains(github.event.head_commit.message, '[listen-pack]') }}
        run: |
          set -euo pipefail
          QA=$(find build-qa -type f -name MidiForgeQA -perm -u+x | head -n 1)
          "$QA" --corpus-layer-ablation 64 corpus-layer-ablation.csv | tee corpus-layer-ablation.log
          test -s corpus-layer-ablation.csv
          test -s corpus-layer-ablation-pipeline.csv
          test -s corpus-layer-ablation-candidates.csv
          candidate_rows=$(wc -l < corpus-layer-ablation-candidates.csv)
          test "$candidate_rows" -eq 64513
          rows=$(wc -l < corpus-layer-ablation.csv)
          test "$rows" -eq 451
          pipeline_rows=$(wc -l < corpus-layer-ablation-pipeline.csv)
          test "$pipeline_rows" -eq 115201

      - name: Analyze candidate audit (offline feasibility probe; headless only)
        if: ${{ !contains(github.event.head_commit.message, '[listen-pack]') }}
        run: |
          set -euo pipefail
          python3 tools/ablation/analyze_corpus_candidates.py \
            --candidates corpus-layer-smoke-a-candidates.csv \
            --targets data/corpus_targets.json \
            --output corpus-layer-smoke-a-analysis.json
          python3 tools/ablation/analyze_corpus_candidates.py \
            --candidates corpus-layer-smoke-b-candidates.csv \
            --targets data/corpus_targets.json \
            --output corpus-layer-smoke-b-analysis.json
          cmp corpus-layer-smoke-a-analysis.json corpus-layer-smoke-b-analysis.json
          python3 tools/ablation/analyze_corpus_candidates.py \
            --candidates corpus-layer-ablation-candidates.csv \
            --targets data/corpus_targets.json \
            --output corpus-candidate-selection-analysis.json
          test -s corpus-candidate-selection-analysis.json

      - name: Smoke-test memorability probe (2 fixed seeds)
        run: |
          set -euo pipefail
          QA=$(find build-qa -type f -name MidiForgeQA -perm -u+x | head -n 1)
          "$QA" --memorability-report 2 memorability-smoke.csv
          test -s memorability-smoke.csv
          rows=$(wc -l < memorability-smoke.csv)
          test "$rows" -eq 17
          grep -q "hook_present,hook_count" memorability-smoke.csv

      - name: Validate memorability analyzer and anonymous selection
        run: |
          set -euo pipefail
          python3 -m py_compile tools/memorability/analyze_baseline.py tools/memorability/prepare_blind_pack.py
          python3 tools/memorability/analyze_baseline.py \
            --input memorability-smoke.csv \
            --output-dir memorability-smoke-analysis \
            --expected-seeds 2 \
            --expected-slots 8 \
            --listening-items 12
          python3 tools/memorability/prepare_blind_pack.py prepare \
            --selection memorability-smoke-analysis/listening-selection.csv \
            --export-selection memorability-smoke-analysis/listening-pack-selection.csv \
            --answer-key memorability-smoke-analysis/listening-answer-key.csv \
            --expected-items 12
          test -s memorability-smoke-analysis/summary.md
          test -s memorability-smoke-analysis/counterexamples.csv
          test -s memorability-smoke-analysis/listening-pack-selection.csv
          test -s memorability-smoke-analysis/listening-answer-key.csv
          grep -q clip_01.mid memorability-smoke-analysis/listening-pack-selection.csv
          grep -q clip_12.mid memorability-smoke-analysis/listening-pack-selection.csv

      - name: Export one-off listening pack from a broad deterministic candidate pool
        if: ${{ contains(github.event.head_commit.message, '[listen-pack]') }}
        run: |
          set -euo pipefail
          QA=$(find build-qa -type f -name MidiForgeQA -perm -u+x | head -n 1)

          # The 2-seed smoke report above only validates the analyzer. Do not
          # use its 16 candidates for human listening: repeated packs were too
          # likely to reuse the same seeds/slots. Select 12 clips from a wider,
          # fixed 32-seed pool while keeping the filenames fully anonymous.
          "$QA" --memorability-report 32 memorability-listening-report.csv | tee memorability-listening-report.log
          test -s memorability-listening-report.csv
          rows=$(wc -l < memorability-listening-report.csv)
          test "$rows" -eq 257

          python3 tools/memorability/analyze_baseline.py \
            --input memorability-listening-report.csv \
            --output-dir memorability-listening-analysis \
            --expected-seeds 32 \
            --expected-slots 8 \
            --listening-items 12
          test -s memorability-listening-analysis/listening-selection.csv
          test -s memorability-listening-analysis/summary.md

          python3 tools/memorability/prepare_blind_pack.py prepare \
            --selection memorability-listening-analysis/listening-selection.csv \
            --export-selection memorability-listening-analysis/listening-pack-selection.csv \
            --answer-key memorability-listening-analysis/listening-answer-key.csv \
            --expected-items 12

          "$QA" --memorability-pack memorability-listening-analysis/listening-pack-selection.csv memorability-smoke-listening-pack
          clips=$(find memorability-smoke-listening-pack -type f -name '*.mid' | wc -l)
          test "$clips" -eq 12
          python3 tools/memorability/prepare_blind_pack.py finalize \
            --pack-dir memorability-smoke-listening-pack \
            --expected-items 12
          test -s memorability-smoke-listening-pack/LISTENING_PROMPT.md

      - uses: actions/upload-artifact@v4
        if: ${{ always() && contains(github.event.head_commit.message, '[listen-pack]') }}
        with:
          name: memorability-listening-pack-smoke
          path: memorability-smoke-listening-pack/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ always() && contains(github.event.head_commit.message, '[listen-pack]') }}
        with:
          name: memorability-listening-pack-answer-key
          path: |
            memorability-listening-analysis/listening-answer-key.csv
            memorability-listening-analysis/listening-selection.csv
            memorability-listening-analysis/summary.md
            memorability-listening-report.csv
            memorability-listening-report.log
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memorability-smoke
          path: |
            memorability-smoke.csv
            memorability-smoke-analysis/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-layer-ablation
          path: |
            corpus-layer-ablation.csv
            corpus-layer-ablation-pipeline.csv
            corpus-layer-ablation-candidates.csv
            corpus-candidate-selection-analysis.json
            corpus-layer-smoke-a-analysis.json
            corpus-layer-ablation.log
            corpus-layer-smoke-a.csv
            corpus-layer-smoke-a-pipeline.csv
            corpus-layer-smoke-a-candidates.csv
            corpus-layer-smoke-b.csv
            corpus-layer-smoke-b-pipeline.csv
            corpus-layer-smoke-b-candidates.csv
          if-no-files-found: ignore

      - name: Generate first-pick blind MIDI rating pack (8 fixed seeds; headless only)
        if: ${{ !contains(github.event.head_commit.message, '[listen-pack]') }}
        run: |
          set -euo pipefail
          QA=$(find build-qa -type f -name MidiForgeQA -perm -u+x | head -n 1)
          "$QA" --calibration-pack 8 calibration-midi-pilot
          test -s calibration-midi-pilot/ratings-template.csv
          test -s calibration-midi-pilot/answer-key.csv
          audit_rows=$(wc -l < calibration-midi-pilot/comparison-audit.csv)
          test "$audit_rows" -eq 73
          rows=$(wc -l < calibration-midi-pilot/ratings-template.csv)
          test "$rows" -ge 2
          key_rows=$(wc -l < calibration-midi-pilot/answer-key.csv)
          test "$key_rows" -eq "$rows"
          clips=$(find calibration-midi-pilot/midi -type f -name '*.mid' | wc -l)
          expected_clips=$(( (rows - 1) * 2 ))
          test "$clips" -eq "$expected_clips"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-midi-pilot
          path: calibration-midi-pilot/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: qa-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ablation-pilot
          path: ablation-pilot.csv

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libasound2-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build-sanitize/_deps
          key: ${{ runner.os }}-qa-sanitize-juce-8.0.14-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure ASan + UBSan
        run: |
          cmake -S tests -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitized QA
        run: cmake --build build-sanitize --config Debug --parallel

      - name: Run sanitized quality checks
        env:
          MIDIFORGE_PIPELINE_TRACE: "1"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1:symbolize=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          QA=$(find build-sanitize -type f -name MidiForgeQA -perm -u+x | head -n 1)
          echo "Running $QA under ASan + UBSan"
          "$QA" | tee sanitized-qa-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-quality-report
          path: sanitized-qa-report.txt

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Windows VST3
        run: cmake -S . -B build-win

      - name: Build Windows VST3
        run: cmake --build build-win --config Release --parallel

  # The full 256-seed memorability pack is intentionally manual on main so ordinary
  # direct-to-main commits do not each rerun the longer baseline. The 2-seed smoke
  # test remains part of every standard quality run.
  memorability-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [quality, sanitizers, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libasound2-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build-qa/_deps
          key: ${{ runner.os }}-qa-memorability-juce-8.0.14-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure headless QA target
        run: cmake -S tests -B build-qa -DCMAKE_BUILD_TYPE=Release

      - name: Build headless QA target
        run: cmake --build build-qa --config Release --parallel

      - name: Generate 256-seed baseline
        run: |
          set -euo pipefail
          QA=$(find build-qa -type f -name MidiForgeQA -perm -u+x | head -n 1)
          mkdir -p memorability-artifacts
          "$QA" --memorability-report 256 memorability-artifacts/memorability-baseline-108000-108255.csv \
            | tee memorability-artifacts/report.log
          test -s memorability-artifacts/memorability-baseline-108000-108255.csv
          rows=$(wc -l < memorability-artifacts/memorability-baseline-108000-108255.csv)
          test "$rows" -eq 2049

      - name: Analyze baseline and choose listening clips
        run: |
          set -euo pipefail
          python3 tools/memorability/analyze_baseline.py \
            --input memorability-artifacts/memorability-baseline-108000-108255.csv \
            --output-dir memorability-artifacts \
            --expected-seeds 256 \
            --expected-slots 8 \
            --listening-items 12
          test -s memorability-artifacts/summary.md
          test -s memorability-artifacts/counterexamples.csv
          test -s memorability-artifacts/listening-selection.csv

      - name: Export and validate blind MIDI pack
        run: |
          set -euo pipefail
          QA=$(find build-qa -type f -name MidiForgeQA -perm -u+x | head -n 1)
          python3 tools/memorability/prepare_blind_pack.py prepare \
            --selection memorability-artifacts/listening-selection.csv \
            --export-selection memorability-artifacts/listening-pack-selection.csv \
            --answer-key memorability-artifacts/listening-answer-key.csv \
            --expected-items 12
          "$QA" --memorability-pack memorability-artifacts/listening-pack-selection.csv memorability-artifacts/listening-pack
          clips=$(find memorability-artifacts/listening-pack -type f -name '*.mid' | wc -l)
          test "$clips" -eq 12
          python3 tools/memorability/prepare_blind_pack.py finalize \
            --pack-dir memorability-artifacts/listening-pack \
            --expected-items 12
          test -s memorability-artifacts/listening-pack/LISTENING_PROMPT.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memorability-listening-pack-blind
          path: memorability-artifacts/listening-pack/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memorability-baseline-108000-108255
          path: memorability-artifacts/
          if-no-files-found: warn
