name: Build MIDI Forge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Раньше искали ровно "MidiForge.vst3", но JUCE называет бандл по PRODUCT_NAME
          # ("MIDI Forge"), поэтому файл с таким именем никогда не находился и шаг падал.
          $vst = Get-ChildItem build -Filter "*.vst3" -Recurse | Select-Object -First 1
          if (-not $vst) { throw "No .vst3 file was found under build/" }
          Compress-Archive -Path $vst.FullName -DestinationPath dist\MidiForge-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MidiForge-Windows-x64
          path: dist/MidiForge-Windows-x64.zip
